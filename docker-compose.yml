services:
  db:
    image: postgres:15
    container_name: olist_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_password}
      POSTGRES_DB: ${POSTGRES_DB:-olist_db}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
